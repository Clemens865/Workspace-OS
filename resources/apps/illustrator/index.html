<!doctype html>
<html>
<head>
  <title>Illustrator Light</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wos-app ill">
    <div class="topbar">
      <div class="wos-toolbar tools" id="tools">
        <button class="wos-btn icon ghost on" data-tool="select" title="Select (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="ellipse" title="Ellipse (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="pen" title="Pen (P): click points; click the first one to close, double-click or Enter to finish"><svg viewBox="0 0 24 24"><path d="M12 3l7 7-4 9H9l-4-9z"/><circle cx="12" cy="11" r="1.5"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="pencil" title="Pencil (B)"><svg viewBox="0 0 24 24"><path d="M4 20c3-1 4-5 7-6s4 2 6 1 2-5 3-7"/></svg></button>
        <button class="wos-btn icon ghost" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M6 6h12M12 6v13"/></svg></button>
      </div>
      <div class="wos-toolbar">
        <button class="wos-btn icon ghost" id="undo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12h-2"/></svg></button>
        <button class="wos-btn icon ghost" id="redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12h2"/></svg></button>
      </div>
      <div class="wos-toolbar">
        <button class="wos-btn icon ghost" id="zoom-out" title="Zoom out (⌘−)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M16 16l4 4"/></svg></button>
        <span class="zoom wos-small" id="zoom">100%</span>
        <button class="wos-btn icon ghost" id="zoom-in" title="Zoom in (⌘+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M16 16l4 4"/></svg></button>
        <button class="wos-btn small ghost" id="fit" title="Fit the artboard (⌘0)">Fit</button>
        <button class="wos-btn icon ghost" id="grid" title="Grid"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></button>
      </div>
      <div class="spacer"></div>
      <div class="wos-toolbar">
        <button class="wos-btn small ghost" id="ai-open" title="Ask the AI to draw something into the artboard"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg> Draw with AI</button>
        <button class="wos-btn small ghost" id="import" title="Open an SVG into this drawing">Import SVG</button>
        <button class="wos-btn small ghost" id="export-svg">Export SVG</button>
        <button class="wos-btn small ghost" id="export-png">PNG</button>
        <button class="wos-btn small ghost" id="new" title="Start a new drawing">New</button>
      </div>
    </div>

    <div class="ai-bar" id="ai-bar" hidden>
      <input class="wos-input" id="ai-prompt" placeholder="A fox sitting under a crescent moon, in flat shapes">
      <button class="wos-btn primary small" id="ai-go">Draw</button>
      <button class="wos-btn ghost small" id="ai-close">Close</button>
      <div class="wos-spinner" id="ai-busy" hidden></div>
    </div>
    <div class="wos-error" id="error" hidden></div>

    <div class="body">
      <div class="canvas-wrap" id="wrap">
        <svg id="canvas" tabindex="0">
          <defs>
            <pattern id="grid-pat" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" class="grid-line"/></pattern>
          </defs>
          <g id="view">
            <rect id="board" class="board"/>
            <rect id="board-grid" class="board-grid" fill="url(#grid-pat)"/>
            <g id="shapes"></g>
            <g id="overlay"></g>
          </g>
        </svg>
        <div class="hint wos-small wos-muted" id="hint"></div>
      </div>

      <aside class="panel">
        <section class="wos-stack" id="props"></section>
        <section class="layers">
          <div class="layers-head"><span class="wos-label">Layers</span>
            <span class="wos-row">
              <button class="wos-btn icon ghost small" id="forward" title="Bring forward (⌘])"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
              <button class="wos-btn icon ghost small" id="backward" title="Send backward (⌘[)"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
            </span>
          </div>
          <ul class="layer-list" id="layers"></ul>
        </section>
      </aside>
    </div>
  </div>
  <svg id="measure" class="measure" aria-hidden="true"></svg>
  <script src="model.js"></script>
  <script src="core.js"></script>
  <script src="tools.js"></script>
  <script src="panels.js"></script>
</body>
</html>
