<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worklive — Screen Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=lg13">
</head>
<body>
<div id="viewport">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="sky" aria-hidden="true">
    <svg class="ridge ridge-far" viewBox="0 0 1600 300" preserveAspectRatio="none"><path d="M0 220 L90 170 L160 190 L260 120 L340 160 L420 110 L520 175 L640 130 L720 150 L820 90 L900 140 L1000 115 L1080 160 L1180 100 L1270 150 L1360 120 L1460 170 L1600 130 L1600 300 L0 300Z"/></svg>
    <svg class="ridge ridge-near" viewBox="0 0 1600 300" preserveAspectRatio="none"><path d="M0 250 L120 200 L210 230 L330 180 L460 235 L560 205 L700 240 L1000 240 L1120 200 L1230 225 L1340 175 L1460 220 L1600 190 L1600 300 L0 300Z"/></svg>
    <div class="horizon"></div>
  </div>

  <div id="stage">
    <header id="chrome-top">
      <div class="brand">
        <div class="wordmark">WORKLIVE</div>
        <button class="back" id="back" hidden><span>‹</span> <span id="back-label">Team overview</span></button>
        <h1 id="title">Your team</h1>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <div class="top-right">
          <div id="toggle" class="seg" role="tablist" aria-label="View">
            <button role="tab" data-mode="agents" class="on">Agents</button>
            <button role="tab" data-mode="cases">Cases</button>
          </div>
        <button class="pill" id="project-filter">All projects <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="round" id="search-btn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.6-4.6"/></svg></button>
      </div>
    </header>

    <div id="world"></div>
    <div id="layer"></div>

    <div id="hint" class="hint">Scroll to explore · choose a screen to step closer</div>
    <div class="footnote">Screen Landscape · Design study</div>

    <nav id="dock" aria-label="Main">
      <button data-go="overview"><i class="ic ic-home"></i><span>Overview</span></button>
      <button data-go="inbox"><i class="ic ic-inbox"></i><span>Inbox</span><b class="badge">3</b></button>
      <button data-go="projects"><i class="ic ic-folder"></i><span>Projects</span></button>
      <button data-go="library"><i class="ic ic-book"></i><span>Library</span></button>
      <button data-go="menu"><i class="ic ic-dots"></i><span>Menu</span></button>
      <span class="dock-glow" aria-hidden="true"></span>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="data.js?v=lg13"></script>
<script src="app.js?v=lg13"></script>
<script type="module" src="bg.js?v=lg13"></script>
</body>
</html>
