<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Workspace · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;640;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--sunk:#F0F0F2;--rail:#ECECEE;--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8A8A8E;--hair:rgba(0,0,0,.09);--blue:#0071E3;--dark:#1D1D1F;--ok:#30B44A;--warn-ink:#8A5A00;--warn-bg:#FFF4E0;--sh-card:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);--r:16px;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shell{display:grid;grid-template-columns:76px 1fr;height:100vh}
.rail{background:var(--rail);border-right:.5px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rlogo{width:32px;height:32px;border-radius:9px;background:var(--dark);display:grid;place-items:center;color:#fff;margin-bottom:10px}.rlogo .ic{width:17px;height:17px;stroke-width:2.1}
.ritem{width:56px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-2);cursor:pointer;position:relative}
.ritem .ic{width:21px;height:21px}.ritem span{font-size:10px;font-weight:500;letter-spacing:-.01em}
.ritem.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.ritem .badge{position:absolute;top:4px;right:8px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.rgap{flex:1}.rdiv{width:34px;height:.5px;background:var(--hair);margin:6px 0}
.rspace{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;cursor:pointer}
.stage{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:.5px solid var(--hair);background:rgba(245,245,247,.85);backdrop-filter:blur(20px)}
.tabs{display:flex;gap:4px;align-items:center;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab .ic{width:15px;height:15px}.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.tab .x,.tab .po{color:var(--ink-3);cursor:pointer;display:inline-flex}.tab .x{font-size:14px}
.spacer{flex:1}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--card);border:.5px solid var(--hair);border-radius:99px;padding:7px 12px;color:var(--ink-3);font-size:13px;cursor:pointer;min-width:190px}
.cmdk .k{margin-left:auto;font-size:11px;background:var(--sunk);padding:2px 6px;border-radius:5px;color:var(--ink-2)}
.working{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px;background:var(--card);padding:6px 10px;border-radius:99px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.working .live{width:7px;height:7px;border-radius:99px;background:var(--ok)}
.body{flex:1;overflow:auto;min-height:0}
.surface{display:none;height:100%}.surface.on{display:block}
.pad{padding:26px 30px;max-width:820px}
h1{font-size:28px;font-weight:640;letter-spacing:-.035em;margin:6px 0 4px}
.lede{font-size:16px;color:var(--ink-2);margin-bottom:18px}
.b{height:40px;padding:0 18px;border-radius:11px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border:0}
.b.blue{background:var(--blue);color:#fff}.b.quiet{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Home split */
.split{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:100%}
.feed{overflow:auto;padding:20px 24px 40px;border-right:.5px solid var(--hair)}
.command{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:99px;box-shadow:var(--sh-card);padding:6px 6px 6px 15px;margin-bottom:20px}
.command input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px}.command input::placeholder{color:var(--ink-3)}
.command .ask{background:var(--dark);color:#fff;border:0;font:inherit;font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:99px;cursor:pointer}
.sec{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}.sec h2{font-size:14px;font-weight:600;margin:0}.sec .n{color:var(--ink-3);font-size:12px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh-card);padding:15px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card.sel{box-shadow:0 0 0 2px var(--blue),var(--sh-card)}
.card.gone{display:none}
.card .top{display:flex;align-items:center;gap:10px}
.who{width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2)}.who .ic{width:17px;height:17px}
.card h3{font-size:14px;font-weight:600;margin:0}.card .by{color:var(--ink-2);font-size:12px;margin-top:1px}
.card .go{margin-left:auto;color:var(--ink-3);font-size:12px;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-top:9px;color:var(--ink-2)}.tag .ic{width:13px;height:13px}.tag .ok{color:var(--ok)}.tag.willsend{color:var(--warn-ink)}
.peek{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.peekhead{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:.5px solid var(--hair)}
.peekhead .pt{font-weight:600;font-size:15px}.peekhead .sub{color:var(--ink-3);font-size:12px}
.peekhead .act{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px;background:var(--card);padding:7px 11px;border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.peekbody{flex:1;overflow:auto;padding:22px;max-width:640px}
.peekempty{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:14px;text-align:center}
.mail{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-card);overflow:hidden}
.mailrow{display:flex;gap:10px;padding:12px 18px;border-bottom:.5px solid var(--hair);font-size:13.5px}.mailrow .l{color:var(--ink-3);width:60px;flex-shrink:0}
.mailbody{padding:18px;font-size:14.5px;line-height:1.6}
.willbar{display:flex;align-items:center;gap:8px;margin:18px 0;color:var(--warn-ink);background:var(--warn-bg);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:500}.willbar .ic{width:16px;height:16px}
.actions{display:flex;gap:10px}
/* generic surface bits */
.gcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-card);padding:20px;margin-bottom:12px}
.muted{color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:.5px solid var(--hair);border-radius:10px;overflow:hidden;font-size:13px;background:var(--card)}
.grid .h{background:var(--sunk);color:var(--ink-2);font-weight:600;padding:7px 10px;text-align:center;border-right:.5px solid var(--hair);border-bottom:.5px solid var(--hair)}
.grid .c{padding:7px 10px;border-right:.5px solid var(--hair);border-bottom:.5px solid var(--hair);min-height:32px}
.grid .c.sel{box-shadow:inset 0 0 0 2px var(--blue)}
/* office ribbon — signals full editor functionality */
.ribbon{background:var(--card);border-bottom:.5px solid var(--hair)}
.rtabs{display:flex;gap:2px;padding:8px 16px 0}
.rtabs b{font-weight:500;font-size:12.5px;color:var(--ink-2);padding:6px 12px;border-radius:8px 8px 0 0;cursor:pointer}
.rtabs b.on{color:var(--ink);font-weight:600;background:var(--sunk)}
.rtools{display:flex;align-items:center;gap:4px;padding:8px 16px;background:var(--sunk);flex-wrap:wrap}
.rt{font-size:12.5px;color:var(--ink);background:var(--card);padding:6px 11px;border-radius:8px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.04);white-space:nowrap}
.rt.b{font-weight:700}.rt.i{font-style:italic}.rt.u{text-decoration:underline}
.rsep{width:.5px;height:20px;background:var(--hair);margin:0 4px}
/* palette + popout overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50}
.overlay.on{display:flex}
.palette{margin-top:12vh;width:560px;max-width:90vw;background:var(--card);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.30);overflow:hidden}
.palette .in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:.5px solid var(--hair)}
.palette input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:transparent}
.presults{max-height:340px;overflow:auto;padding:8px}
.pgroup{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 4px}
.prow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.prow:hover,.prow.hi{background:var(--sunk)}.prow .ic{width:17px;height:17px;color:var(--ink-2)}.prow .r{margin-left:auto;color:var(--ink-3);font-size:12px}
.pop{margin:6vh auto 0;width:840px;max-width:94vw;height:78vh;background:var(--bg);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.popbar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:.5px solid var(--hair);background:var(--card)}
.lights{display:flex;gap:6px}.lights i{width:11px;height:11px;border-radius:99px;display:block}.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.popcap{position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);color:#fff;background:var(--dark);padding:8px 14px;border-radius:99px;font-size:12.5px}
</style></head>
<body>
<div class="shell">
  <div class="rail" id="rail">
    <div class="rlogo"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
    <div class="ritem on" data-s="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></div>
    <div class="ritem" data-s="files"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h4l2 3h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span>Files</span></div>
    <div class="ritem" data-s="mail"><span class="badge">2</span><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M5 8l7 5 7-5"/></svg><span>Mail</span></div>
    <div class="ritem" data-s="calendar"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></svg><span>Calendar</span></div>
    <div class="ritem" data-s="chats"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.5-6.6L20 4v5h-5"/></svg><span>Chats</span></div>
    <div class="ritem" data-s="browser"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Browser</span></div>
    <div class="ritem" data-s="agents"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 20a6 6 0 0 1 12 0"/></svg><span>Agents</span></div>
    <div class="rgap"></div><div class="rdiv"></div>
    <div class="rspace" style="background:#0071E3">W</div><div class="rspace" style="background:#8A8A8E">P</div>
    <div class="rdiv"></div>
    <div class="ritem" data-s="settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg><span>Settings</span></div>
  </div>
  <div class="stage">
    <div class="topbar">
      <div class="tabs" id="tabs">
        <div class="tab on" data-tab="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> Home</div>
      </div>
      <div class="spacer"></div>
      <div class="working" id="workingChip"><span class="live"></span> <span id="workCount">2</span> working</div>
      <div class="cmdk" id="cmdkBtn"><svg class="ic" style="width:15px;height:15px" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg> Search or run <span class="k">⌘K</span></div>
    </div>
    <div class="body" id="body"><!-- surfaces injected --></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="paletteOv"><div class="palette" onclick="event.stopPropagation()">
  <div class="in"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg><input id="pInput" placeholder="Search files, or ask an assistant to do something…"/></div>
  <div class="presults" id="pResults"></div>
</div></div>
<div class="overlay" id="popOv"><div class="pop" onclick="event.stopPropagation()">
  <div class="popbar"><div class="lights"><i></i><i></i><i></i></div><b id="popTitle" style="font-size:13px">Mail</b><div class="spacer"></div><div class="cmdk" style="min-width:120px">⌘K</div></div>
  <div class="body" id="popBody" style="padding:0"></div>
</div><div class="popcap">On a second monitor — same live workspace</div></div>
<script src="prototype.js"></script>
</body></html>
