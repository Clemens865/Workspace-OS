name: Installer diagnostics

# Temporary: runs the NSIS installer from an earlier Windows build run and
# reports why it fails. Runs when this file changes; nothing is published.

on:
  push:
    branches: [windows-native]
    paths: [.github/workflows/installer-diag.yml]

env:
  RUN_ID: "40081784257"

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace-os-windows
          path: ${{ runner.temp }}/dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Artifact contents
        run: Get-ChildItem "$env:RUNNER_TEMP\dist" -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
      - name: Run the installer three ways
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\dist" -Recurse -Filter "*Setup*.exe" | Select-Object -First 1).FullName
          Write-Host "installer: $setup"
          $sig = Get-AuthenticodeSignature $setup; Write-Host "signature: $($sig.Status)"
          foreach ($a in @('/S', '/S /NCRC', '/S /currentuser')) {
            $p = Start-Process $setup -ArgumentList $a -Wait -PassThru
            Write-Host ("args '{0}': exit {1} (0x{2:X8})" -f $a, $p.ExitCode, $p.ExitCode)
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Programs\$($_.Name)" }
          }
          $global:LASTEXITCODE = 0
      - name: Crash records
        if: always()
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001 } -MaxEvents 6 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.TimeCreated) id $($_.Id)"; Write-Host $_.Message }
          Get-ChildItem "$env:LOCALAPPDATA\CrashDumps" -ErrorAction SilentlyContinue | Out-Host
