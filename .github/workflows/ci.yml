name: CI

# Fast checks on every push and pull request. The engine and installer builds
# live in the macOS and Windows workflows.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The recall eval needs a downloaded embedding model; it is a measurement, not a unit test.
      - name: Unit tests
        run: npm test -- --reporter=dot --exclude "**/*.eval.test.ts"

      - name: Build
        run: npm run build
