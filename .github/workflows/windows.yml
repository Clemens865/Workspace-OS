name: Windows build

# Native Windows build of the fork's windows-native branch: phase 0 spikes
# (docs/WINDOWS-NATIVE-PLAN.md) and the installer. Runs on push to that branch or
# by hand. Nothing is published; the installer is an artifact of the run.

on:
  push:
    branches: [windows-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (baseline on Windows, not yet gating)
        continue-on-error: true
        run: npm test -- --reporter=dot 2>&1 | Tee-Object -FilePath unit-tests.log

      - name: Install LibreOffice
        run: |
          choco install libreoffice-fresh -y --no-progress
          & "C:\Program Files\LibreOffice\program\soffice.exe" --version
          Test-Path "C:\Program Files\LibreOffice\program\fundamental.ini"

      - name: Fetch LibreOfficeKit headers (oldest supported engine)
        shell: bash
        run: LOK_HEADER_REF=libreoffice-24.2.7.2 bash scripts/lok/fetch-headers.sh

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wos-lok-host.exe (MSVC)
        shell: cmd
        run: scripts\lok\build-host.cmd

      - name: Prepare engine fixtures
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          New-Item -ItemType Directory -Force $fx | Out-Null
          "Hello from Workspace OS on Windows`r`n`r`nSecond paragraph with some ink." | Set-Content -Encoding utf8 "$fx\test-document.txt"
          "a;b;c`r`n1;2;3`r`n4;5;6" | Set-Content -Encoding utf8 "$fx\t.csv"
          & "C:\Program Files\LibreOffice\program\soffice.exe" --headless --convert-to docx --outdir $fx "$fx\test-document.txt" | Out-Host
          Copy-Item examples\Harbour-Terminal-Q3.xlsx $fx
          Get-ChildItem $fx | Out-Host

      # Diagnostics while the spikes are open: each document alone, plain and in
      # Batch mode, so one hang does not hide the others. Not gating.
      # Diagnostics while S1 is open: Calc documents hang on load on Windows
      # while Writer renders. Try the xlsx under environment variants and list the
      # processes LibreOffice starts while it hangs. Not gating.
      # Diagnostics while S1 is open: Calc documents hang on load on Windows while
      # Writer renders (not OpenCL, no child process). 1) a blank Calc document;
      # 2) all thread stacks of the hung engine via cdb with LibreOffice's public
      # symbol server. Not gating.
      - name: "S1 diag: blank Calc document"
        continue-on-error: true
        env:
          WOS_SMOKE_TIMEOUT_MS: "30000"
        run: |
          $lo = "C:\Program Files\LibreOffice\program"
          $out = Join-Path $env:RUNNER_TEMP "blank.ods"
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "new:swriter:$env:RUNNER_TEMP\blank.odt" 
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "new:scalc:$out"

      - name: "S1 diag: thread stacks of the hung xlsx load"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $lo = "C:\Program Files\LibreOffice\program"
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Host "cdb.exe not found"; exit 0 }
          $job = Start-Job -ScriptBlock { param($wd, $lo, $doc) Set-Location $wd; $env:WOS_SMOKE_TIMEOUT_MS = "240000"; node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" $doc 2>&1 } -ArgumentList (Get-Location).Path, $lo, "$fx\Harbour-Terminal-Q3.xlsx"
          Start-Sleep -Seconds 20
          $hostPid = (Get-Process wos-lok-host -ErrorAction SilentlyContinue | Select-Object -First 1).Id
          Write-Host "hung engine pid: $hostPid"
          $sym = "srv*$env:RUNNER_TEMP\sym*https://dev-downloads.libreoffice.org/symstore/symbols;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          & $cdb.FullName -p $hostPid -pv -y $sym -c ".symopt+ 0x10; .reload; ~*kc 40; qd" 2>&1 | Out-String -Width 400 | Write-Host
          Get-Process wos-lok-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Receive-Job $job -Wait | Write-Host

      - name: "S1 + S2: engine renders docx, xlsx and csv through fd 3/4 pipes"
        continue-on-error: true
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $lo = "C:\Program Files\LibreOffice\program"
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "$fx\test-document.docx" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\t.csv"

      - name: "S3: native modules for Electron"
        run: |
          npx electron-rebuild -f -w better-sqlite3,node-pty
          $env:ELECTRON_RUN_AS_NODE = "1"
          & node_modules\electron\dist\electron.exe -e "const D=require('better-sqlite3'); const r=new D(':memory:').prepare('select 41+1 as x').get(); require('node-pty'); console.log('native modules ok', JSON.stringify(r), process.versions.electron)"

      - name: Build app
        run: npm run build

      - name: "S4: NSIS installer"
        run: npx electron-builder --win --publish never

      - name: Upload installer and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-os-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.yml
            unit-tests.log
