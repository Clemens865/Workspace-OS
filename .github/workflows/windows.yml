name: Windows build

# Native Windows build of the fork's windows-native branch: phase 0 spikes
# (docs/WINDOWS-NATIVE-PLAN.md) and the installer. Runs on push to that branch or
# by hand. Nothing is published; the installer is an artifact of the run.

on:
  push:
    branches: [windows-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (baseline on Windows, not yet gating)
        continue-on-error: true
        run: npm test -- --reporter=dot 2>&1 | Tee-Object -FilePath unit-tests.log

      - name: Install LibreOffice
        run: |
          choco install libreoffice-fresh -y --no-progress
          & "C:\Program Files\LibreOffice\program\soffice.exe" --version
          Test-Path "C:\Program Files\LibreOffice\program\fundamental.ini"

      - name: Fetch LibreOfficeKit headers (oldest supported engine)
        shell: bash
        run: LOK_HEADER_REF=libreoffice-24.2.7.2 bash scripts/lok/fetch-headers.sh

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wos-lok-host.exe (MSVC)
        shell: cmd
        run: scripts\lok\build-host.cmd

      - name: Prepare engine fixtures
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          New-Item -ItemType Directory -Force $fx | Out-Null
          "Hello from Workspace OS on Windows`r`n`r`nSecond paragraph with some ink." | Set-Content -Encoding utf8 "$fx\test-document.txt"
          "a;b;c`r`n1;2;3`r`n4;5;6" | Set-Content -Encoding utf8 "$fx\t.csv"
          & "C:\Program Files\LibreOffice\program\soffice.exe" --headless --convert-to docx --outdir $fx "$fx\test-document.txt" | Out-Host
          Copy-Item examples\Harbour-Terminal-Q3.xlsx $fx
          Get-ChildItem $fx | Out-Host

      # Diagnostics while the spikes are open: each document alone, plain and in
      # Batch mode, so one hang does not hide the others. Not gating.
      # Diagnostics while S1 is open: Calc documents hang on load on Windows
      # while Writer renders. Try the xlsx under environment variants and list the
      # processes LibreOffice starts while it hangs. Not gating.
      # S1 open point: Calc tiles come back empty on Windows (Writer renders).
      # Try the renderers: Skia off (GDI), Skia raster. Not gating.
      # S1 open point: Calc tiles are opaque black on Windows (Writer's page is
      # white on a black application background). Check the runner's system
      # colours, then seed the host profile with a light appearance, with and
      # without explicit scheme colours. Not gating.
      - name: "S1 diag: Calc colours"
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $sc = [System.Drawing.SystemColors]
          Write-Host ("high contrast: {0}; Window {1}; WindowText {2}; AppWorkspace {3}" -f [System.Windows.Forms.SystemInformation]::HighContrast, $sc::Window.Name, $sc::WindowText.Name, $sc::AppWorkspace.Name)
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $lo = "C:\Program Files\LibreOffice\program"
          $profile = Join-Path $env:TEMP "wos-lok-host-profile"
          $head = '<?xml version="1.0" encoding="UTF-8"?><oor:items xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
          $bar = '<item oor:path="/org.openoffice.Office.Views/Windows"><node oor:name="26100" oor:op="replace"><prop oor:name="Visible" oor:op="fuse"><value>false</value></prop></node></item>'
          $light = '<item oor:path="/org.openoffice.Office.Common/Appearance"><prop oor:name="ApplicationAppearance" oor:op="fuse"><value>1</value></prop></item>'
          $scheme = "/org.openoffice.Office.UI/ColorScheme/ColorSchemes/org.openoffice.Office.UI:ColorScheme['LibreOffice']"
          $colors = '<item oor:path="/org.openoffice.Office.UI/ColorScheme"><prop oor:name="CurrentColorScheme" oor:op="fuse"><value>LibreOffice</value></prop></item>' +
            "<item oor:path=`"$scheme/DocColor`"><prop oor:name=`"Color`" oor:op=`"fuse`"><value>16777215</value></prop></item>" +
            "<item oor:path=`"$scheme/AppBackground`"><prop oor:name=`"Color`" oor:op=`"fuse`"><value>16777215</value></prop></item>" +
            "<item oor:path=`"$scheme/FontColor`"><prop oor:name=`"Color`" oor:op=`"fuse`"><value>0</value></prop></item>"
          foreach ($v in @(@{ n = "light"; body = $bar + $light }, @{ n = "light+colors"; body = $bar + $light + $colors })) {
            Write-Host "=== $($v.n)"
            Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force (Join-Path $profile "user") | Out-Null
            ($head + $v.body + '</oor:items>') | Set-Content -Encoding utf8 (Join-Path $profile "user\registrymodifications.xcu")
            $env:WOS_SMOKE_DUMP_DIR = Join-Path $env:RUNNER_TEMP "tiles\$($v.n)"
            node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\test-document.docx"
            Get-Process wos-lok-host -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue

      # Calc on LibreOffice 25.8+ needs the formula bar hidden (wos-lok-host.cpp,
      # hideCalcFormulaBar); the host does that in its private profile.
      - name: "S1 + S2: engine renders docx, xlsx and csv through fd 3/4 pipes"
        env:
          WOS_SMOKE_DUMP_DIR: ${{ runner.temp }}\tiles
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $lo = "C:\Program Files\LibreOffice\program"
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "$fx\test-document.docx" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\t.csv"

      - name: "S3: native modules for Electron"
        run: |
          npx electron-rebuild -f -w better-sqlite3,node-pty
          $env:ELECTRON_RUN_AS_NODE = "1"
          & node_modules\electron\dist\electron.exe -e "const D=require('better-sqlite3'); const r=new D(':memory:').prepare('select 41+1 as x').get(); require('node-pty'); console.log('native modules ok', JSON.stringify(r), process.versions.electron)"

      - name: Build app
        run: npm run build

      - name: "S4: NSIS installer"
        run: npx electron-builder --win --publish never

      - name: Upload installer and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-os-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.yml
            unit-tests.log
            ${{ runner.temp }}/tiles/**/*.ppm
