name: Windows build

# Native Windows build of the fork's windows-native branch: phase 0 spikes
# (docs/WINDOWS-NATIVE-PLAN.md) and the installer. Runs on push to that branch or
# by hand. Nothing is published; the installer is an artifact of the run.

on:
  push:
    branches: [windows-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (baseline on Windows, not yet gating)
        continue-on-error: true
        run: npm test -- --reporter=dot 2>&1 | Tee-Object -FilePath unit-tests.log

      - name: Install LibreOffice
        run: |
          choco install libreoffice-fresh -y --no-progress
          & "C:\Program Files\LibreOffice\program\soffice.exe" --version
          Test-Path "C:\Program Files\LibreOffice\program\fundamental.ini"

      - name: Fetch LibreOfficeKit headers (oldest supported engine)
        shell: bash
        run: LOK_HEADER_REF=libreoffice-24.2.7.2 bash scripts/lok/fetch-headers.sh

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wos-lok-host.exe (MSVC)
        shell: cmd
        run: scripts\lok\build-host.cmd

      - name: Prepare engine fixtures
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          New-Item -ItemType Directory -Force $fx | Out-Null
          "Hello from Workspace OS on Windows`r`n`r`nSecond paragraph with some ink." | Set-Content -Encoding utf8 "$fx\test-document.txt"
          "a;b;c`r`n1;2;3`r`n4;5;6" | Set-Content -Encoding utf8 "$fx\t.csv"
          & "C:\Program Files\LibreOffice\program\soffice.exe" --headless --convert-to docx --outdir $fx "$fx\test-document.txt" | Out-Host
          Copy-Item examples\Harbour-Terminal-Q3.xlsx $fx
          Get-ChildItem $fx | Out-Host

      # Diagnostics while the spikes are open: each document alone, plain and in
      # Batch mode, so one hang does not hide the others. Not gating.
      # Diagnostics while S1 is open: Calc documents hang on load on Windows
      # while Writer renders. Try the xlsx under environment variants and list the
      # processes LibreOffice starts while it hangs. Not gating.
      # S1 finding: Calc deadlocks on Windows from LibreOffice 25.8 on. The VCL main
      # thread waits for the SolarMutex in CoWaitForMultipleHandles (since core
      # commit "Try to use CoWaitForMultipleHandles magic to handle COM message
      # loop", 2025-01-10), which does not process the SetWindowPos that the
      # LOK thread sends while creating the formula bar's Name Box. Up to 25.2 the
      # wait was MsgWaitForMultipleObjects(QS_SENDMESSAGE). Two experiments:
      # 1) LibreOffice 25.2.7.2, unpacked with msiexec /a (not installed);
      # 2) 26.8 with the formula bar (child window 26100) hidden in the profile.
      - name: "S1 diag: LibreOffice 25.2 and hidden formula bar"
        continue-on-error: true
        timeout-minutes: 25
        env:
          WOS_SMOKE_TIMEOUT_MS: "30000"
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $profile = Join-Path $env:TEMP "wos-lok-host-profile"

          Write-Host "=== 1) LibreOffice 25.2.7.2"
          $msi = Join-Path $env:RUNNER_TEMP "lo252.msi"
          Invoke-WebRequest "https://downloadarchive.documentfoundation.org/libreoffice/old/25.2.7.2/win/x86_64/LibreOffice_25.2.7.2_Win_x86-64.msi" -OutFile $msi
          $target = Join-Path $env:RUNNER_TEMP "lo252"
          Start-Process msiexec.exe -Wait -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`""
          $prog = (Get-ChildItem $target -Recurse -Filter mergedlo.dll | Select-Object -First 1).DirectoryName
          Write-Host "program dir: $prog"
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$prog\\" "$prog\fundamental.ini" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\t.csv" "new:scalc:$env:RUNNER_TEMP\blank252.ods"
          Get-Process wos-lok-host -ErrorAction SilentlyContinue | Stop-Process -Force

          Write-Host "=== 2) LibreOffice 26.8, formula bar hidden in the profile"
          $lo = "C:\Program Files\LibreOffice\program"
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $profile "user") | Out-Null
          @'
          <?xml version="1.0" encoding="UTF-8"?>
          <oor:items xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <item oor:path="/org.openoffice.Office.Views/Windows"><node oor:name="26100" oor:op="replace"><prop oor:name="Visible" oor:op="fuse"><value>false</value></prop></node></item>
          </oor:items>
          '@ | ForEach-Object { $_ -replace '(?m)^          ', '' } | Set-Content -Encoding utf8 (Join-Path $profile "user\registrymodifications.xcu")
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\t.csv"
          Get-Process wos-lok-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue

      - name: "S1 + S2: engine renders docx, xlsx and csv through fd 3/4 pipes"
        continue-on-error: true
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "wos-fixtures"
          $lo = "C:\Program Files\LibreOffice\program"
          node e2e/lok-host-smoke.mjs scripts\lok\wos-lok-host.exe "$lo\" "$lo\fundamental.ini" "$fx\test-document.docx" "$fx\Harbour-Terminal-Q3.xlsx" "$fx\t.csv"

      - name: "S3: native modules for Electron"
        run: |
          npx electron-rebuild -f -w better-sqlite3,node-pty
          $env:ELECTRON_RUN_AS_NODE = "1"
          & node_modules\electron\dist\electron.exe -e "const D=require('better-sqlite3'); const r=new D(':memory:').prepare('select 41+1 as x').get(); require('node-pty'); console.log('native modules ok', JSON.stringify(r), process.versions.electron)"

      - name: Build app
        run: npm run build

      - name: "S4: NSIS installer"
        run: npx electron-builder --win --publish never

      - name: Upload installer and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-os-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.yml
            unit-tests.log
